name: Training Roster Automation CI/CD
on:
  push:
    branches: [dev, qa, master]
  pull_request:
    branches: [dev, qa, master]

env:
  AWS_REGION: ap-south-1
  TEMPLATE_PATH: template.yml

jobs:
  SetEnv: 
    uses: ./.github/workflows/get-deploy-env.yml

  Cloudformation-deploy:
    needs: SetEnv
    environment: ${{needs.SetEnv.outputs.ENV}}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4

    # Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4 
      with:
        role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5 
      with:
        python-version: '3.12' 

    # Configure AWS SAM CLI
    - name: Configure AWS SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true

    # Install dependencies
    - name: Install dependencies
      run: . ${{ github.workspace }}/build-scripts/install.sh

    # SAM build and package
    - name: SAM build and package
      run: |
        sam build --template-file ${{ env.TEMPLATE_PATH }}
        sam package --template-file .aws-sam/build/template.yaml --kms-key-id alias/aws/s3 --s3-bucket ${{ vars.SAM_BUCKET }}-${{ needs.SetEnv.outputs.ENV_LOWER }} --s3-prefix TRAINING-ROSTER-AUTOMATION --output-template-file ${{ env.TEMPLATE_PATH }}

    # Deploy cloudformation template using aws cloudformation deploy action
    - name: Deploy
      uses: aws-actions/aws-cloudformation-github-deploy@v1
      with:
        name: ${{ vars.APP_STACK_NAME }}
        template: template.yml
        role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/LillyCloudFormationExecutionRole
        parameter-overrides: file://${{ github.workspace }}/${{ vars.PARAMETER_FILE_NAME  }}
        capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
        no-fail-on-empty-changeset: "1"