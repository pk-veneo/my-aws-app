AWSTemplateFormatVersion: "2010-09-09"
Transform: 'AWS::Serverless-2016-10-31'

Description: >
  Training Roster Automation Lambda Function

Parameters:
  DeployEnvironment:
    Type: String
    AllowedValues:
      - dev
      - qa
      - prod
    ConstraintDescription: must specify development, test, or prod.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
      - NONE

Mappings:
  EnvironmentConfiguration:
    dev:
      GatewayStageName: Dev
    qa:
      GatewayStageName: QA
    prod:
      GatewayStageName: Prod

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Tracing: Active

Resources:
  # API Gateway Account Configuration for CloudWatch Logging
  ApiGatewayAccountConfig:
    Type: "AWS::ApiGateway::Account"
    Properties:
      CloudWatchRoleArn: !GetAtt "ApiGatewayLoggingRole.Arn"

  ApiGatewayLoggingRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "apigateway.amazonaws.com"
            Action: "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
          
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: CloudFormationEC2RDSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UntagRole
                Resource: "*"
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:InvokeFunction
                Resource: "*"
              - Effect: Allow
                Action:
                  - apigateway:* 
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::*-dev
                  - arn:aws:s3:::*-qa
                  - arn:aws:s3:::*-prod
                  - arn:aws:s3:::*-dev/*
                  - arn:aws:s3:::*-qa/*
                  - arn:aws:s3:::*-prod/*
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:CreateSubnet
                  - ec2:CreateSecurityGroup
                  - ec2:Describe*
                  - ec2:DeleteVpc
                  - ec2:DeleteSubnet
                  - ec2:DeleteSecurityGroup
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateTags
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                Resource: "*"
              - Effect: Allow
                Action:
                  - rds:*
                Resource: "*"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: LambdaAdminPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"

  # Main Training Roster Lambda Function
  TrainingRosterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: main.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment
      Events:
        GetRoster:
          Type: Api
          Properties:
            RestApiId: !Ref TrainingRosterApi
            Path: /roster
            Method: get
      Tags:
        Application: TrainingRosterAutomation
        Environment: !Ref DeployEnvironment

  # API Gateway
  TrainingRosterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !FindInMap [EnvironmentConfiguration, !Ref DeployEnvironment, GatewayStageName]
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Lambda Permission for API Gateway (automatically created by SAM)

  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: MyAuroraVPC

  MySubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: MyAuroraSubnet1

  MySubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: MyAuroraSubnet2

  MyDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for Aurora cluster"
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0 # Restrict this in production!

  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Subnet group for Aurora cluster"
      SubnetIds:
        - !Ref MySubnet1
        - !Ref MySubnet2

  AuroraDBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "15.3" # You can specify the version you want
      MasterUsername: mymasteruser
      MasterUserPassword: mymasterpassword
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref MyDBSecurityGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: 07:00-09:00
      PreferredMaintenanceWindow: sun:05:00-sun:06:00

  AuroraDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraDBCluster
      DBInstanceClass: db.r6g.large
      Engine: aurora-postgresql
      PubliclyAccessible: false

Outputs:
  TrainingRosterFunctionArn:
    Description: ARN of the Training Roster Lambda Function
    Value: !GetAtt TrainingRosterFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TrainingRosterFunctionArn"

  TrainingRosterApiUrl:
    Description: URL of the Training Roster API Gateway
    Value: !Sub "https://${TrainingRosterApi}.execute-api.${AWS::Region}.amazonaws.com/${TrainingRosterApi.Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-TrainingRosterApiUrl"

  TrainingRosterFunctionName:
    Description: Name of the Training Roster Lambda Function
    Value: !Ref TrainingRosterFunction
    Export:
      Name: !Sub "${AWS::StackName}-TrainingRosterFunctionName"

  CloudFormationExecutionRoleArn:
    Description: "ARN of the CloudFormation execution role"
    Value: !GetAtt CloudFormationExecutionRole.Arn
  LambdaExecutionRoleArn:
    Description: "ARN of the Lambda execution role"
    Value: !GetAtt LambdaExecutionRole.Arn
