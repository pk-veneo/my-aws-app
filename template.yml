AWSTemplateFormatVersion: "2010-09-09"
Transform: 'AWS::Serverless-2016-10-31'

Description: >
  Training Roster Automation Lambda Function

Parameters:
  DeployEnvironment:
    Type: String
    AllowedValues:
      - dev
      - qa
      - prod
    ConstraintDescription: must specify development, test, or prod.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
      - NONE

Mappings:
  EnvironmentConfiguration:
    dev:
      GatewayStageName: Dev
    qa:
      GatewayStageName: QA
    prod:
      GatewayStageName: Prod

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Tracing: Active

Resources:
  # API Gateway Account Configuration for CloudWatch Logging
  ApiGatewayAccountConfig:
    Type: "AWS::ApiGateway::Account"
    Properties:
      CloudWatchRoleArn: !GetAtt "ApiGatewayLoggingRole.Arn"

  ApiGatewayLoggingRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "apigateway.amazonaws.com"
            Action: "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
          
  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Main Training Roster Lambda Function
  TrainingRosterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: main.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment
      Events:
        GetRoster:
          Type: Api
          Properties:
            RestApiId: !Ref TrainingRosterApi
            Path: /roster
            Method: get
      Tags:
        Application: TrainingRosterAutomation
        Environment: !Ref DeployEnvironment

  # API Gateway
  TrainingRosterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !FindInMap [EnvironmentConfiguration, !Ref DeployEnvironment, GatewayStageName]
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Lambda Permission for API Gateway (automatically created by SAM)

Outputs:
  TrainingRosterFunctionArn:
    Description: ARN of the Training Roster Lambda Function
    Value: !GetAtt TrainingRosterFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TrainingRosterFunctionArn"

  TrainingRosterApiUrl:
    Description: URL of the Training Roster API Gateway
    Value: !Sub "https://${TrainingRosterApi}.execute-api.${AWS::Region}.amazonaws.com/${TrainingRosterApi.Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-TrainingRosterApiUrl"

  TrainingRosterFunctionName:
    Description: Name of the Training Roster Lambda Function
    Value: !Ref TrainingRosterFunction
    Export:
      Name: !Sub "${AWS::StackName}-TrainingRosterFunctionName"
